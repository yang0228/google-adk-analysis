name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check examples tests
      - run: uv run pytest -q
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run lint:md
      - run: npm run test:docs
      - run: node scripts/check_docs.mjs --python .venv/bin/python
      - run: npm run check:diagrams
